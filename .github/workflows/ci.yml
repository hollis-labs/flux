name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # go.mod pins the toolchain; the envelope exporter runs through `go run`.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/generate-plugin-imports.mjs --check
      - run: npm run build
      # src/generated/envelope-types.generated.ts is gitignored and written by
      # the build's prebuild step, so the check only means something after it.
      - run: npm run check:envelopes
      - run: npm test -- --run
